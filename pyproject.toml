[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-gesture-recognition"
version = "0.1.0"
description = "Hand gesture recognition using CNN"
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "numpy",
    "torch",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[tool.setuptools]
py-modules = ["model", "dataset", "train", "evaluate", "collect_data", "augmentations"]
